name: CI — Build & Type Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🔨 Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🔍 Type Check
        run: npx tsc --noEmit --pretty 2>&1 || echo "⚠️ Type errors found (non-blocking)"
        continue-on-error: true

      - name: 🏗️ Build
        run: npm run build
        env:
          NEXT_PUBLIC_LIFF_ID: ${{ vars.NEXT_PUBLIC_LIFF_ID || '2009652089-lRGKgXfJ' }}
          NEXT_PUBLIC_LIFF_ID_RUBBER: ${{ vars.NEXT_PUBLIC_LIFF_ID_RUBBER || '2010005557-IH15wYcZ' }}

      - name: 📊 Build Summary
        if: always()
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ ${{ job.status }} == "success" ]; then
            echo "✅ **Build passed** on \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Build failed** on \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
