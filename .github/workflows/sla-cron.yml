name: SLA Monitoring Cron
on:
  schedule:
    - cron: '*/10 * * * *' # Run every 10 minutes
  workflow_dispatch: # Allow manual trigger

jobs:
  ping-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Ping RubJob SLA Cron
        run: |
          curl -X GET "https://${{ secrets.APP_DOMAIN }}/api/admin/orders/cron" \
          -H "x-cron-key: ${{ secrets.CRON_KEY }}"
